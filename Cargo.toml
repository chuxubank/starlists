[package]
name = "starlists"
version = "0.1.0"
edition = "2021"
description = "Local-first CLI for GitHub starred repositories and official Star Lists"
license = "MIT"
repository = "https://github.com/chuxubank/starlists"
homepage = "https://github.com/chuxubank/starlists"
readme = "README.md"
keywords = ["github", "stars", "cli", "lists"]
categories = ["command-line-utilities"]

[[bin]]
name = "stars"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
